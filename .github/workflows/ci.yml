# The single CI of the repository (design §9.2). Runs on PRs, on code events
# only (one run per round; editing the title, body or labels of the PR starts
# no run), and on push to main, to test the sum of PRs merged in a row. On
# main the tests job skips when the tree is the head of a merged PR whose CI
# was green, or when only inert docs changed; policy (a PR matter) does not run. The "CI" job is the aggregator required by the protection of
# main, together with the review/independent status. `runs-on` reads the
# CI_RUNS_ON variable (JSON: a string or a list of labels) for a self-hosted
# runner; without it, ubuntu-latest (GitHub-hosted).
#
# The verifiers that decide the gate (scripts/ci-gate.sh,
# scripts/check-attribution.sh, scripts/check-docs.sh,
# scripts/lib/sensitive_paths.py and .github/sensitive-paths) are read from the
# base commit of the PR, checked out at base/: a PR cannot weaken the check
# that judges it. On push to main the gate is read from github.sha (the commit
# that carries this workflow). github.event.before is the previous main: the
# adoption push has no verifiers there, and an update still has the old gate.
# The first CI, when the base has no method, does not run the pull request's
# checkers in the policy job (that job holds pull-requests: write). The
# aggregator falls back to the gate of this commit only when base/scripts/ci-gate.sh
# is absent.
name: "CI"
run-name: "CI · ${{ github.event_name == 'push' && format('main · {0}', github.event.head_commit.message) || format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Public template: CI also runs on push to main. A repository that refuses
  # those minutes records `pr` in .github/ci-mode and deletes this push trigger.
  push:
    branches: [main]
    # Only CHANGELOG.md and ROADMAP.md: no run. phase-start.sh already accepts a
    # base with no CI check when the merged PR has the same tree and green CI.
    # end-check.sh accepts a base with no check when a merged PR holds the commit.
    # close-phase.sh reads the CI of the PR head, not of this push.
    paths-ignore:
      - CHANGELOG.md
      - ROADMAP.md

permissions: {}

# A new push cancels the previous run of the same PR; a run of main is never
# cancelled (phase-start.sh waits for the run of the base commit).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: "Changes"
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      workflows: ${{ steps.detect.outputs.workflows }}
      app: ${{ steps.detect.outputs.app }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      event: ${{ steps.detect.outputs.event }}
      run_tests: ${{ steps.detect.outputs.run_tests }}
      confirmed: ${{ steps.detect.outputs.confirmed }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Checkout the gh pin from the base"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: .github
      - name: "Install pinned gh"
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          pin="base/.github/gh-pin"
          if [ ! -f "$pin" ]; then
            if command -v gh >/dev/null 2>&1; then
              echo "ok: base has no .github/gh-pin; using gh already on PATH"
              gh --version
              exit 0
            fi
            echo "::error::base commit has no .github/gh-pin (version and sha256) and gh is not on PATH. The job does not install gh from the pull request."
            exit 1
          fi
          version="$(awk 'NF && $1 !~ /^#/ { print; exit }' "$pin")"
          case "${RUNNER_OS_NAME:-}" in
            Linux) asset_os=linux ;;
            macOS) asset_os=macOS ;;
            *) echo "::error::gh pin: unsupported runner.os ${RUNNER_OS_NAME:-}"; exit 1 ;;
          esac
          case "${RUNNER_ARCH_NAME:-}" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::gh pin: unsupported runner.arch ${RUNNER_ARCH_NAME:-}"; exit 1 ;;
          esac
          line="$(awk -v k="$asset_os-$arch" '$1 == k { print $2, $3; exit }' "$pin")"
          want="${line%% *}"
          kind="${line#* }"
          if [ -z "$version" ] || [ -z "$want" ] || [ "$want" = "$line" ]; then
            echo "::error::base .github/gh-pin has no version or no sha256 for $asset_os-$arch"
            exit 1
          fi
          tarball="gh_${version}_${asset_os}_${arch}.${kind}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "https://github.com/cli/cli/releases/download/v${version}/${tarball}"
          if command -v sha256sum >/dev/null 2>&1; then
            got="$(sha256sum "$tarball" | awk '{ print $1 }')"
          else
            got="$(shasum -a 256 "$tarball" | awk '{ print $1 }')"
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::gh ${version} sha256 mismatch for $tarball (expected $want, got $got)"
            exit 1
          fi
          case "$kind" in
            tar.gz) tar xzf "$tarball" ;;
            zip) unzip -q "$tarball" ;;
            *) echo "::error::gh pin: unknown archive $kind"; exit 1 ;;
          esac
          echo "$RUNNER_TEMP/gh_${version}_${asset_os}_${arch}/bin" >>"$GITHUB_PATH"
          echo "ok: installed pinned gh ${version} for ${asset_os}-${arch}"
      - name: "Detect changed paths"
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stdin_grep() { local r=0; grep "$@" >/dev/null || r=$?; cat >/dev/null || true; return $r; }
          # Files of the PR (since the merge-base), one per line.
          files="$(git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | tr '\0' '\n')"
          echo "$files"
          has() { echo "$files" | stdin_grep -qE "$1" && echo true || echo false; }
          # By exclusion: a doc is a file in docs/ or a .md, except the issue
          # templates (read by the scripts). Everything else is code and runs
          # lint, whatever its folder. The tests job runs on every PR: tests
          # read AGENTS.md, the skills and the design.
          nondocs="$(echo "$files" | grep -vE '(^docs/|\.md$)' || true)"
          templates="$(echo "$files" | grep -E '^\.github/ISSUE_TEMPLATE/' || true)"
          if [ -z "$nondocs" ] && [ -z "$templates" ]; then code=false; else code=true; fi
          # The tests job (the slow one) runs unless the PR changes nothing that
          # tests read. Inert: docs/ (except the design), the .md at the root
          # (except AGENTS.md and CLAUDE.md), and the generated CHANGELOG.md and
          # ROADMAP.md (no test reads their content, #137). Skills, hooks, scripts, workflows and app are never inert.
          needs_tests() { # needs_tests <files>: true when any file is not inert
            if echo "$1" | grep -vE '^$' | grep -vE '^(docs/|[^/]+\.md$)' | stdin_grep -q .; then echo true
            elif echo "$1" | grep -E '^(docs/process-design\.md|AGENTS\.md|CLAUDE\.md)$' | stdin_grep -q .; then echo true
            else echo false; fi
          }
          run_tests="$(needs_tests "$files")"
          # Code unchanged since a commit of this PR whose newest Tests result is a
          # success. Looks back 15 commits. Only skipped looks further; a failure,
          # cancellation, timeout or pending result on a newer commit runs again.
          # The newest run is the highest id (a queued run may have no started_at).
          # A check of the same name from another app does not count.
          if [ "$run_tests" = true ]; then
            for c in $(git rev-list --max-count=15 "$BASE_SHA..$HEAD_SHA" | tail -n +2); do
              delta="$(git diff --name-only --no-renames -z "$c" "$HEAD_SHA" 2>/dev/null | tr '\0' '\n' || echo "?")"
              [ "$(needs_tests "$delta")" = false ] || break
              raw="$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/check-runs?per_page=100" 2>/dev/null)" || {
                echo "Tests check unread on $c: running"
                break
              }
              conc="$(printf '%s' "$raw" | jq -r '[.check_runs[]? | select(.name == "Tests" and ((.app.slug // "github-actions") == "github-actions"))] | sort_by((.id // 0), (.started_at // "")) | last
                | if . == null then "missing"
                  elif (.status // "completed") != "completed" then (.status // "pending")
                  else (.conclusion // "missing") end' 2>/dev/null || echo apierr)"
              case "$conc" in
                skipped) continue ;;
                success)
                  if git merge-base --is-ancestor "$BASE_SHA" "$c" 2>/dev/null; then
                    run_tests=false
                    echo "tests already passed on $c, code unchanged since, commit contains the base"
                    break
                  fi
                  echo "Tests success on $c does not contain the current base: running"
                  break
                  ;;
                *)
                  echo "Tests on $c is $conc: running"
                  break
                  ;;
              esac
            done
          fi
          workflows="$(has '^\.github/workflows/')"
          # On main: the tree of this commit is the head of a merged PR whose CI was green and
          # whose Tests did not fail (success, or skipped by the rules above): everything was
          # already verified on that very tree, so lint, workflows and tests run for nothing.
          # Only the sum of PRs merged in a row (a tree no PR ever had) is tested here.
          # confirmed=true: this run only repeats that proof, so the CI job does not start.
          confirmed=false
          if [ "${EVENT_NAME:-pull_request}" = push ] && [ "$run_tests$code$workflows" != falsefalsefalse ]; then
            tree="$(git rev-parse "$HEAD_SHA^{tree}")"
            for ph in $(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha' 2>/dev/null || true); do
              [ "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$ph" --jq .tree.sha 2>/dev/null || true)" = "$tree" ] || continue
              ci_conc="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ph/check-runs?per_page=100" --jq '[.check_runs[]? | select(.name == "CI" and ((.app.slug // "github-actions") == "github-actions"))] | sort_by((.id // 0), (.started_at // "")) | last | if . == null then "missing" elif (.status // "completed") != "completed" then "pending" else (.conclusion // "missing") end' 2>/dev/null || echo apierr)"
              tests_conc="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ph/check-runs?per_page=100" --jq '[.check_runs[]? | select(.name == "Tests" and ((.app.slug // "github-actions") == "github-actions"))] | sort_by((.id // 0), (.started_at // "")) | last | if . == null then "missing" elif (.status // "completed") != "completed" then "pending" else (.conclusion // "missing") end' 2>/dev/null || echo apierr)"
              if [ "$ci_conc" = success ] && { [ "$tests_conc" = success ] || [ "$tests_conc" = skipped ]; }; then
                run_tests=false code=false workflows=false
                confirmed=true
                echo "already tested in the PR"
                echo "same tree as the head $ph of a merged PR with green CI: nothing to run"
                if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                  printf '%s\n' "already tested in the PR" >>"$GITHUB_STEP_SUMMARY"
                fi
                break
              fi
            done
          fi
          {
            echo "code=$code"
            echo "workflows=$workflows"
            echo "run_tests=$run_tests"
            echo "confirmed=$confirmed"
            echo "app=$(has '^(app/|\.github/workflows/deploy-example\.yml)')"
            echo "event=${EVENT_NAME:-pull_request}"
            if [ "$code" = true ]; then echo "docs_only=false"; else echo "docs_only=true"; fi
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  policy:
    name: "Policy"
    # A matter of the PR (its commits, body and paths): main only receives what passed it.
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # After the PR checkout, which cleans the workspace.
      - name: "Checkout the verifiers from the base"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github
      - name: "Install pinned gh"
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          pin="base/.github/gh-pin"
          if [ ! -f "$pin" ]; then
            if command -v gh >/dev/null 2>&1; then
              echo "ok: base has no .github/gh-pin; using gh already on PATH"
              gh --version
              exit 0
            fi
            echo "::error::base commit has no .github/gh-pin (version and sha256) and gh is not on PATH. The job does not install gh from the pull request."
            exit 1
          fi
          version="$(awk 'NF && $1 !~ /^#/ { print; exit }' "$pin")"
          case "${RUNNER_OS_NAME:-}" in
            Linux) asset_os=linux ;;
            macOS) asset_os=macOS ;;
            *) echo "::error::gh pin: unsupported runner.os ${RUNNER_OS_NAME:-}"; exit 1 ;;
          esac
          case "${RUNNER_ARCH_NAME:-}" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::gh pin: unsupported runner.arch ${RUNNER_ARCH_NAME:-}"; exit 1 ;;
          esac
          line="$(awk -v k="$asset_os-$arch" '$1 == k { print $2, $3; exit }' "$pin")"
          want="${line%% *}"
          kind="${line#* }"
          if [ -z "$version" ] || [ -z "$want" ] || [ "$want" = "$line" ]; then
            echo "::error::base .github/gh-pin has no version or no sha256 for $asset_os-$arch"
            exit 1
          fi
          tarball="gh_${version}_${asset_os}_${arch}.${kind}"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "https://github.com/cli/cli/releases/download/v${version}/${tarball}"
          if command -v sha256sum >/dev/null 2>&1; then
            got="$(sha256sum "$tarball" | awk '{ print $1 }')"
          else
            got="$(shasum -a 256 "$tarball" | awk '{ print $1 }')"
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::gh ${version} sha256 mismatch for $tarball (expected $want, got $got)"
            exit 1
          fi
          case "$kind" in
            tar.gz) tar xzf "$tarball" ;;
            zip) unzip -q "$tarball" ;;
            *) echo "::error::gh pin: unknown archive $kind"; exit 1 ;;
          esac
          echo "$RUNNER_TEMP/gh_${version}_${asset_os}_${arch}/bin" >>"$GITHUB_PATH"
          echo "ok: installed pinned gh ${version} for ${asset_os}-${arch}"
      - name: "Check AI attribution in commits and PR body"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ ! -f base/scripts/check-attribution.sh ]; then
            echo "ok: base has no attribution checker (first CI); the checker of the pull request is not run beside the write token"
            exit 0
          fi
          printf '%s\n' "$PR_BODY" >"$RUNNER_TEMP/pr-body.md"
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          base/scripts/check-attribution.sh --range "$base..$HEAD_SHA" --text-file "$RUNNER_TEMP/pr-body.md"
      - name: "Label sensitive paths with needs-owner-ok"
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f base/scripts/lib/sensitive_paths.py ]; then
            echo "ok: base has no sensitive-path checker (first CI); the checker of the pull request is not run beside the write token"
            exit 0
          fi
          touched="$(git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | python3 base/scripts/lib/sensitive_paths.py base/.github/sensitive-paths)"
          if [ -n "$touched" ]; then
            echo "sensitive paths:"; echo "$touched"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=needs-owner-ok" >/dev/null
            echo "::notice::needs-owner-ok: this PR touches sensitive paths and needs the owner's ok"
          else
            echo "no sensitive paths"
          fi
      # The checker of the base judges the docs of the PR.
      - name: "Check docs limits"
        run: |
          if [ ! -f base/scripts/check-docs.sh ]; then
            echo "ok: base has no docs checker (first CI); the checker of the pull request is not run beside the write token"
            exit 0
          fi
          REPO_ROOT="$PWD" base/scripts/check-docs.sh

  lint:
    name: "Lint"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Shellcheck and Python syntax"
        run: scripts/validate.sh --lint

  tests:
    name: "Tests"
    needs: changes
    if: needs.changes.outputs.run_tests != 'false'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Script and hook tests"
        run: scripts/validate.sh --tests
      # Example: the app is only built here on the PR; deploy-example.yml
      # validates main, builds and deploys, by workflow_dispatch. Replace the
      # command with the build of your project.
      - name: "Build the app"
        if: needs.changes.outputs.app == 'true'
        run: app/build.sh "$RUNNER_TEMP/app-dist"

  workflows:
    name: "Workflows"
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Install actionlint"
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          # Binary by the OS and architecture of the runner (hosted or self-hosted).
          case "$RUNNER_OS_NAME" in
            Linux) os=linux ;;
            macOS) os=darwin ;;
            *) echo "::error::actionlint: unsupported runner.os $RUNNER_OS_NAME"; exit 1 ;;
          esac
          case "$RUNNER_ARCH_NAME" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::actionlint: unsupported runner.arch $RUNNER_ARCH_NAME"; exit 1 ;;
          esac
          # Pinned version, verified against the checksums file of the release itself.
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_${os}_${arch}.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$tarball"
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          curl -sSfL "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" | grep " $tarball\$" | $sum -c -
          tar xzf "$tarball" actionlint
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: "Run actionlint"
        run: actionlint -color
      - name: "Check workflow standard"
        env:
          PROCESS_CI_MODE: ${{ vars.PROCESS_CI_MODE }}
        run: python3 scripts/check-workflows.py

  ci:
    name: "CI"
    needs: [changes, policy, lint, tests, workflows]
    # A push that only confirms a tree the PR already tested does not start this job.
    if: always() && needs.changes.outputs.confirmed != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Checkout the gate from the base"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: scripts
      - name: "Aggregate required jobs"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ -f base/scripts/ci-gate.sh ]; then
            base/scripts/ci-gate.sh
          else
            echo "ok: base has no ci-gate.sh (first CI); using the gate of this commit"
            scripts/ci-gate.sh
          fi
