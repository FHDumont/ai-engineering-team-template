# Example deploy workflow: copy it to deploy-<target>.yml and replace the
# "Deploy" step with the real deploy of your project.
# Only workflow_dispatch: the one that dispatches it is scripts/deploy.sh, run by
# the main session after the last merge of the group (once per group). Never on
# pull_request, push or schedule. The "Validate main" job runs
# scripts/validate.sh on main before the build, unless this SHA or the same
# tree already has green CI. An API failure or an absent check still runs the
# suite. A main that does not pass is not published.
# The "deploy-paths" line lists what this workflow publishes. A token that
# starts with ! is excluded. deploy.sh dispatches only when something that
# remains changed since the last successful deploy.
# `runs-on` reads CI_RUNS_ON like ci.yml (default: a GitHub-hosted runner).
# deploy-paths: app/ .github/workflows/deploy-example.yml
name: "Deploy · Example"
run-name: "Deploy · Example · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:

permissions: {}

# In series: a new deploy waits for the previous one, never cancels it.
concurrency:
  group: deploy-example
  cancel-in-progress: false

jobs:
  validate:
    name: "Validate main"
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "See if this tree already has green CI"
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-already-green.sh "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: "Lint and tests on main"
        if: steps.gate.outputs.skip != 'true'
        run: scripts/validate.sh

  build:
    name: "Build"
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Build the app"
        run: app/build.sh dist
      - name: "Upload the build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: "Deploy"
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: "Download the build artifact"
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist
      # REPLACE THIS STEP with the real deploy of your project (publish dist/
      # to your host) and grant this job only the permissions it needs.
      - name: "Deploy (placeholder: replace this step)"
        run: |
          echo "placeholder deploy: nothing is published; the build is kept as the app-dist artifact"
          ls -R dist
